# Three independent services. Any one can be redeployed or go down without breaking the others:
# the Reader serves cached/bundled stories and the Newsroom keeps a local outbox until the API is back.
services:
  - type: web
    name: news-platform-api
    runtime: docker
    rootDir: apps/api
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: NEWSROOM_API_KEY
        sync: false
      - key: NEWS_DATABASE_URL
        sync: false
      - key: NEWS_CORS_ORIGINS
        sync: false
      - key: NEWS_COOKIE_SAMESITE
        value: none
      - key: GROQ_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false

  - type: web
    name: news-reader
    runtime: static
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build:reader
    staticPublishPath: apps/reader/dist
    envVars:
      - key: VITE_SITE_URL
        sync: false
      - key: VITE_API_URL
        sync: false
      - key: SNAPSHOT_URL
        sync: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

  - type: web
    name: news-newsroom
    runtime: static
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && NEWSROOM_BASE=/ pnpm build:newsroom
    staticPublishPath: apps/newsroom/dist
    envVars:
      - key: VITE_API_BASE
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
