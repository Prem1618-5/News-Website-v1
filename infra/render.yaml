# Three independent services. Any one can be redeployed or go down without breaking the others:
# the Reader serves cached/bundled stories and the Newsroom keeps a local outbox until the API is back.
services:
  - type: web
    name: news-platform-api
    runtime: docker
    rootDir: apps/api
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: NEWSROOM_API_KEY
        generateValue: true
      # Neon connection string (secret: Render asks for it when the Blueprint is applied).
      - key: DATABASE_URL
        sync: false
      # JSON list of the two front-end origins, e.g. ["https://news-reader.onrender.com","https://news-newsroom.onrender.com"]
      - key: NEWS_CORS_ORIGINS
        sync: false
      - key: NEWS_COOKIE_SAMESITE
        value: none
      - key: READER_URL
        sync: false
      - key: NEWSROOM_URL
        sync: false
      - key: NEWS_DEPLOY_HOOK_URL
        sync: false
      # First admin; delete NEWSROOM_ADMIN_PASSWORD after the first sign-in.
      - key: NEWSROOM_ADMIN_EMAIL
        sync: false
      - key: NEWSROOM_ADMIN_PASSWORD
        sync: false
      - key: NEWSROOM_ADMIN_NAME
        value: Managing editor
      # AI and translation through Gemini (free tier). The key is a secret: Render asks for it.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      # Neon Auth: second sign-in option for readers. Public address, not a secret.
      - key: NEON_AUTH_URL
        value: https://ep-square-dawn-ao0kxo51.neonauth.c-2.ap-southeast-1.aws.neon.tech/neondb/auth

  - type: web
    name: news-reader
    runtime: static
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build:reader
    staticPublishPath: apps/reader/dist
    envVars:
      - key: VITE_SITE_URL
        sync: false
      - key: VITE_API_URL
        sync: false
      - key: SNAPSHOT_URL
        sync: false
      - key: VITE_NEON_AUTH_URL
        value: https://ep-square-dawn-ao0kxo51.neonauth.c-2.ap-southeast-1.aws.neon.tech/neondb/auth
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

  - type: web
    name: news-newsroom
    runtime: static
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && NEWSROOM_BASE=/ pnpm build:newsroom
    staticPublishPath: apps/newsroom/dist
    envVars:
      - key: VITE_API_BASE
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
